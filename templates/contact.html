{% extends 'base.html' %}{% block title %}Contact – Navnidh Traders{% endblock %}
{% block body %}<div class="container section"><h1 class="mb-4">Contact Us</h1><div class="row g-4"><div class="col-md-5">
<p><strong>Address:</strong> [Your shop address]</p><p><strong>Phone:</strong> [Your phone]</p><p><strong>Email:</strong> [Your email]</p><p><strong>Hours:</strong> [Business hours]</p>
<a class="btn btn-success" target="_blank" rel="noopener" href="{{ wa_link() }}">Chat on WhatsApp</a><p class="mt-3 small text-muted">Google Maps: [add link / embed here]</p></div>
<div class="col-md-7"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-3" name="name" placeholder="Your name" required>
<input class="form-control mb-3" type="email" name="email" placeholder="Email"><textarea class="form-control mb-3" name="message" rows="5" placeholder="Message" required></textarea><button class="btn btn-brown">Send</button></form></div></div></div>{% endblock %}
